<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matéo — Monteur et cadreur vidéo</title>
<style>
  :root{--bg:#060606;--fg:#fafafa;--mut:#7a7a7a;--line:#1f1f1f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif}
  nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;padding:18px 28px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;background:linear-gradient(#000a,#0000)}
  nav a{color:var(--fg);text-decoration:none;margin-left:24px;opacity:.7}
  .hero{position:relative;height:min(78vh,56.25vw);min-height:360px;overflow:hidden;background:#000}
  .hero iframe{position:absolute;top:50%;left:50%;width:100vw;height:56.25vw;min-height:100%;min-width:177.78vh;transform:translate(-50%,-50%);border:0;pointer-events:none}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 55%,#060606)}
  .hero div{position:absolute;left:28px;right:28px;bottom:28px;z-index:2}
  .hero h1{font-size:clamp(34px,6vw,76px);font-weight:700;letter-spacing:-.03em;line-height:1}
  .hero p{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#bbb;margin-top:10px}
  .hero p b{color:#fff;font-weight:600}
  .bar{display:flex;justify-content:space-between;gap:16px 26px;flex-wrap:wrap;padding:26px 28px 14px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .bar div{display:flex;gap:26px;flex-wrap:wrap}
  .bar button{background:none;border:0;color:var(--mut);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding-bottom:8px;border-bottom:1px solid transparent}
  .bar button[aria-pressed=true]{color:var(--fg);border-color:var(--fg)}
  .bar select{background:none;border:0;border-bottom:1px solid #333;color:var(--fg);font:inherit;letter-spacing:inherit;text-transform:inherit;padding-bottom:8px;cursor:pointer}
  .bar select option{color:#000}
  .bar button:focus-visible,.more:focus-visible,.v:focus-visible{outline:1px solid #fff;outline-offset:3px}
  .g{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
  .v{position:relative;border:0;padding:0;cursor:pointer;background:#111;overflow:hidden;aspect-ratio:16/9}
  .v img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s,opacity .3s;opacity:.88}
  .v:hover img{transform:scale(1.04);opacity:.3}
  .v span{position:absolute;left:18px;right:18px;bottom:16px;text-align:left;color:#fff;font:600 12px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:opacity .3s}
  .v span small{display:block;color:#aaa;font-weight:400;margin-top:4px}
  .v:hover span{opacity:1}
  .more{display:block;margin:28px auto 8px;background:none;border:1px solid #333;color:var(--fg);font:600 12px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:14px 28px;cursor:pointer}
  .more:hover{border-color:#fff}
  footer{display:flex;justify-content:space-between;padding:28px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  footer a{color:var(--fg);text-decoration:none}
  @media(max-width:1000px){.g{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){.g{grid-template-columns:1fr}.v span{opacity:1}.v img{opacity:.5}}
</style></head><body>
<nav><span>Mateo</span><span><a href="#travaux">Travaux</a><a href="https://www.instagram.com/pentamaa/" target="_blank" rel="noopener">Contact</a></span></nav>
<section class="hero"><iframe id="reel" allow="autoplay; encrypted-media" title="Showreel"></iframe><div><h1>Mateo</h1><p>Monteur vidéo · <b id="stats"></b></p></div></section>
<div class="bar"><div id="tabs"></div><div id="tri"></div></div>
<main class="g" id="travaux"></main>
<button class="more" id="more"></button>
<footer><span>© 2026 Mateo</span><a href="https://www.instagram.com/pentamaa/" target="_blank" rel="noopener">Instagram @pentamaa</a></footer>
<script src="data.js"></script><script>
// Showreel provisoire : extrait de la vidéo Fort Boyard, en attendant un vrai showreel.
const R="_H5O4_Nph24";
reel.src="https://www.youtube-nocookie.com/embed/"+R+"?autoplay=1&mute=1&controls=0&start=600&loop=1&playlist="+R+"&modestbranding=1&playsinline=1&rel=0";
stats.textContent=V.length+" vidéos · "+F.vues(F.total(V))+" de vues · "+F.clients().length+" clients";
const PREMIERE="_H5O4_Nph24", PAS=24; let f="",cl="",tri="date",n=PAS;
const ORDRE=["Concept / IRL","Gaming / Best Of","Vlog / Live","React","Aftermovie / Cadrage","Cadrage","Autres"];
const cats=["",...ORDRE.filter(t=>V.some(v=>v.type===t))];
const noms=F.clients().sort((a,b)=>V.filter(v=>v.client===b).length-V.filter(v=>v.client===a).length);
function draw(){
  const L=V.filter(v=>(!f||v.type===f)&&(!cl||v.client===cl)).sort((a,b)=>b.date.localeCompare(a.date));
  // Fort Boyard (Domingo) toujours en premier dans « Tout ».
  if(!f&&!cl){const i=L.findIndex(v=>v.id===PREMIERE);if(i>0)L.unshift(L.splice(i,1)[0]);}
  tabs.innerHTML=cats.map(c=>`<button data-c="${F.esc(c)}" aria-pressed="${c===f}">${c?F.esc(c):"Tout"} ${V.filter(v=>!c||v.type===c).length}</button>`).join("");
  document.getElementById("tri").innerHTML=`<select id="cl" aria-label="Filtrer par client"><option value="">Tous les clients</option>${noms.map(c=>`<option${c===cl?" selected":""}>${F.esc(c)}</option>`).join("")}</select>`;
  travaux.innerHTML=L.slice(0,n).map(v=>`<button class="v" data-id="${v.id}"><img src="${F.img(v.id)}" onerror="this.onerror=null;this.src='${F.mini(v.id)}'" alt="" loading="lazy"><span>${F.esc(v.client)} — ${F.esc(v.titre)}<small>${F.esc(v.role)} · ${F.vues(v.vues)} vues · ${F.annee(v.date)}</small></span></button>`).join("");
  more.style.display=L.length>n?"block":"none"; more.textContent="Voir plus ("+(L.length-n)+" restantes)";
}
tabs.addEventListener("click",e=>{const b=e.target.closest("button");if(b){f=b.dataset.c;n=PAS;draw();}});
document.getElementById("tri").addEventListener("click",e=>{const b=e.target.closest("button");if(b){tri=b.dataset.t;n=PAS;draw();}});
document.getElementById("tri").addEventListener("change",e=>{if(e.target.id==="cl"){cl=e.target.value;n=PAS;draw();}});
more.addEventListener("click",()=>{n+=PAS;draw();});
draw(); F.lecteur();
</script></body></html>
